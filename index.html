<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แบบทดสอบสำหรับการศึกษาการอ่านข้อมูล</title>
<!-- shown in link previews (LINE, Facebook, Messenger, ...) -->
<meta name="description" content="แบบทดสอบสั้น ๆ ใช้เวลาประมาณ 4–6 นาที เป็นส่วนหนึ่งของรายวิชา 2206491 โครงการสารสนเทศศึกษา 1 คณะอักษรศาสตร์ จุฬาลงกรณ์มหาวิทยาลัย">
<meta property="og:type" content="website">
<meta property="og:locale" content="th_TH">
<meta property="og:title" content="แบบทดสอบสำหรับการศึกษาการอ่านข้อมูล">
<meta property="og:description" content="แบบทดสอบสั้น ๆ ใช้เวลาประมาณ 4–6 นาที เป็นส่วนหนึ่งของรายวิชา 2206491 โครงการสารสนเทศศึกษา 1 คณะอักษรศาสตร์ จุฬาลงกรณ์มหาวิทยาลัย">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: single centered column (max 680px). Researcher bar on top is separate from the participant UI.
   Every stage uses the same structure: context line, booking card, information panel, question card. */
:root {
  --bg: #ECF1F8;
  --surface: #FFFFFF;
  --field: #F5F8FC;
  --ink: #12203A;
  --muted: #52647E;
  --line: #D2DBE8;
  --brand: #1F55C7;
  --brand-ink: #FFFFFF;
  --brand-soft: #E3ECFB;
  --ok: #1D7A4B;
  --err: #B3261E;
  --err-soft: #FCEAE8;
  --rbar: #17233A;
  --rbar-ink: #E8EEF6;
  --rbar-line: #33445F;
  --font-display: "Prompt", "Sarabun", system-ui, sans-serif;
  --font-body: "Sarabun", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1526; --surface: #162036; --field: #101A2E; --ink: #E6ECF8; --muted: #9AABC8;
    --line: #29395A; --brand: #7FA8FF; --brand-ink: #0A1B3D; --brand-soft: #1A2B50;
    --ok: #5CC892; --err: #FF8A80; --err-soft: #3A1F1D; --rbar: #09101D; --rbar-ink: #E8EEF6; --rbar-line: #29395A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1526; --surface: #162036; --field: #101A2E; --ink: #E6ECF8; --muted: #9AABC8;
  --line: #29395A; --brand: #7FA8FF; --brand-ink: #0A1B3D; --brand-soft: #1A2B50;
  --ok: #5CC892; --err: #FF8A80; --err-soft: #3A1F1D; --rbar: #09101D; --rbar-ink: #E8EEF6; --rbar-line: #29395A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.65; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
/* #view gets focus on every screen change (for screen readers); it is not a control, so no ring around the whole page */
#view:focus, #view:focus-visible { outline: none; }

/* researcher bar */
.rbar { background: var(--rbar); color: var(--rbar-ink); font-size: 14px; line-height: 1.5; padding-block: 10px; padding-inline: 16px; }
.rbar-in { max-width: 680px; margin-inline: auto; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.rbar b { font-family: var(--font-display); font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--rbar-line); border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 4px 14px; color: var(--rbar-ink); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rbar-line); }
.seg button[aria-pressed="true"] { background: var(--rbar-ink); color: var(--rbar); font-weight: 600; }
.rbar select { background: transparent; border: 1px solid var(--rbar-line); border-radius: 8px; padding: 4px 8px; color: var(--rbar-ink); max-width: 100%; }
.rbar select option { color: #13202B; }
.rbar .link { background: none; border: 0; color: var(--rbar-ink); text-decoration: underline; cursor: pointer; padding: 4px; }
.rbar details { flex-basis: 100%; }
.rbar summary { cursor: pointer; }
.rbar ul { margin: 8px 0 2px; padding-left: 20px; display: grid; gap: 4px; color: #C9D4DE; }
.rbar[hidden] { display: none; }

/* participant UI */
.wrap { max-width: 680px; margin-inline: auto; padding-inline: 16px; padding-block: 20px 56px; display: grid; gap: 16px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: .2px; }
.logo svg { display: block; }
.sim { font-size: 14px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.35; margin: 0; text-wrap: balance; }
h1 { font-size: 26px; }
h2 { font-size: 20px; }
h3 { font-size: 17px; }
p { margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.list { margin: 0; padding-left: 22px; display: grid; gap: 6px; }

.progress { display: grid; gap: 6px; }
.progress .bars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.progress .bars i { height: 6px; border-radius: 3px; background: var(--line); }
.progress .bars i.on { background: var(--brand); }
.progress span { font-size: 14px; color: var(--muted); }

.ctx { font-style: normal; color: var(--ink); padding-left: 14px; border-left: 3px solid var(--line); }
.booking { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: end; }
.booking .logo { grid-column: 1 / -1; padding-bottom: 12px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
.scn { display: grid; gap: 8px; }
.ln { display: flex; gap: 10px; align-items: flex-start; }
.ln .tk { flex: none; margin-top: 5px; color: var(--brand); }
.ln span { min-width: 0; }
.scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.sc-opt { position: relative; display: block; }
.sc-opt input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.sc-opt span { display: grid; place-items: center; height: 54px; border: 1.5px solid var(--line); background: var(--field); border-radius: 10px; font-family: var(--font-display); font-weight: 600; font-size: 20px; }
.sc-opt:hover span { border-color: var(--muted); }
.sc-opt input:checked + span { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.sc-opt input:focus-visible + span { outline: 3px solid var(--brand); outline-offset: 2px; }
.scale-ends { display: flex; justify-content: space-between; gap: 8px; color: var(--ink); font-size: 16px; font-weight: 600; margin-top: 12px; }
.booking .name { font-family: var(--font-display); font-weight: 600; font-size: 19px; }
.booking .paid { font-family: var(--font-display); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.booking .paid small { display: block; font-family: var(--font-body); font-weight: 400; color: var(--muted); font-size: 14px; }
.booking .meta { color: var(--muted); }

.panel { display: grid; gap: 18px; }
.block { display: grid; gap: 10px; min-width: 0; }
.block + .block { border-top: 1px solid var(--line); padding-top: 18px; }
.rows { margin: 0; display: grid; gap: 8px; }
.rows > div { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 12px; }
.rows dt { color: var(--muted); }
.rows dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.hl { font-family: var(--font-display); font-weight: 600; font-size: 19px; }
.notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; color: var(--muted); font-size: 15.5px; }
.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 10px 14px; vertical-align: top; }
tr + tr td { border-top: 1px solid var(--line); }
td:last-child { font-weight: 600; white-space: nowrap; text-align: right; }

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.steps li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 0 12px; position: relative; padding-bottom: 14px; }
.steps li:last-child { padding-bottom: 0; }
.steps li::before { content: ""; position: absolute; left: 13px; top: 26px; bottom: 0; width: 2px; background: var(--line); }
.steps li:last-child::before { display: none; }
.dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); border: 2px solid var(--brand); }
.dot.now::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--brand); }
.steps .t { font-weight: 600; }
.steps .d { color: var(--muted); font-weight: 400; margin-left: 6px; }
.steps .desc { color: var(--muted); font-size: 15.5px; }

.qcard { border-color: var(--brand); border-width: 2px; }
.qlabel { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); font-weight: 700; }
.opts { display: grid; gap: 10px; border: 0; padding: 0; margin: 0; min-width: 0; }
.opt { display: flex; gap: 12px; align-items: flex-start; border: 1.5px solid var(--line); background: var(--field); border-radius: 10px; padding: 12px 14px; cursor: pointer; min-width: 0; }
.opt:hover { border-color: var(--muted); }
.opt:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.opt input { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--brand); flex: none; }
.opt span { min-width: 0; overflow-wrap: anywhere; }
.btns { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 10px; padding: 12px 24px; font-weight: 600; cursor: pointer; }
.btn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
/* waiting for the server after "start": keep the button's colour and show a small spinner */
.btn.busy:disabled { background: var(--brand); color: var(--brand-ink); cursor: progress; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
.btn.busy::before { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .btn.busy::before { animation-duration: 2.4s; } }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.txtbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 8px 4px; }
.err { background: var(--err-soft); color: var(--err); border-radius: 8px; padding: 10px 14px; font-weight: 600; }
.q { font-size: 21px; }
.fq legend { font-family: var(--font-display); font-weight: 600; font-size: 18px; padding: 0; margin-bottom: 10px; line-height: 1.4; }
.consent-box { background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.ph { border: 1.5px dashed var(--muted); border-radius: 8px; padding: 8px 12px; color: var(--muted); font-size: 15px; }
.check { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.check input { margin-top: 6px; width: 20px; height: 20px; accent-color: var(--brand); flex: none; }
.sec-no { display: inline-grid; place-items: center; }
@media (max-width: 480px) {
  body { font-size: 16.5px; }
  .card { padding: 16px; }
  .rows > div { grid-template-columns: 1fr; gap: 0; }
  h1 { font-size: 23px; }
  .btn { width: 100%; }
}
</style>
</head>
<body>

<div class="wrap">
  <main id="view" tabindex="-1"></main>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
